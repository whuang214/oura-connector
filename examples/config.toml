# Copy selected non-secret settings into your user config.toml after setup.
client_id = "YOUR_OURA_CLIENT_ID"
timezone = "America/New_York"
redirect_uri = "http://localhost:8765/callback"
default_sections = ["sleep", "readiness", "activity", "stress", "spo2"]
scopes = ["daily", "heartrate", "workout", "tag", "session", "spo2", "personal", "email"]

http_host = "127.0.0.1"
http_port = 8766
max_pages = 10
max_records = 2000
max_page_bytes = 4000000
max_response_bytes = 8000000
concurrency = 3
timeout_seconds = 20
operation_timeout_seconds = 90
max_retries = 2

# Optional replacement selection; use source field names.
# IDs, source day, type, and timestamps remain automatically.
# [compact_fields]
# sleep = ["total_sleep_duration", "time_in_bed", "average_hrv", "average_heart_rate"]
