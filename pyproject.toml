[project]
name = "oura-connector"
dynamic = ["version"]
description = "Local read-only Oura data retrieval through MCP and HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Will Huang" }]
keywords = ["api", "fastapi", "oura", "health-data", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi==0.139.0",
  "httpx>=0.28.1,<1",
  "mcp==1.28.1",
  "pydantic>=2.12,<3",
  "pywin32>=311; sys_platform == 'win32'",
  "tomli-w>=1.2.0",
  "tzdata>=2025.2",
  "uvicorn==0.51.0",
]

[project.urls]
Documentation = "https://github.com/whuang214/oura-connector/tree/main/docs"
Homepage = "https://github.com/whuang214/oura-connector"
Issues = "https://github.com/whuang214/oura-connector/issues"
Privacy = "https://github.com/whuang214/oura-connector/blob/main/PRIVACY.md"
Repository = "https://github.com/whuang214/oura-connector"
Terms = "https://github.com/whuang214/oura-connector/blob/main/TERMS.md"

[project.scripts]
oura-connector = "oura_connector.interfaces.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pillow>=12,<13",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_connector"]

[tool.hatch.build]
exclude = [
  "/.env",
  "**/.env.*",
  "**/credentials.json*",
  "/.graphify",
  "/.private",
  "/dist",
  "/docs/*verification*",
  "/docs/**/*verification*",
  "/docs/private",
  "/private-results",
  "**/tokens.json*",
  "**/*.log",
]

[tool.hatch.version]
path = "src/oura_connector/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["oura_connector"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
show_error_codes = true
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ntsecuritycon", "win32api", "win32con", "win32security", "win32crypt", "win32event", "win32gui"]
ignore_missing_imports = true
